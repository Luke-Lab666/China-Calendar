name: Update calendar

on:
  schedule:
    # 21:23 Asia/Shanghai (UTC+8), every day. An off-the-hour minute avoids the
    # top-of-hour queue that previously delayed runs by several hours.
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch official data and rebuild feeds
        run: python -m china_calendar.cli
      - name: Test feeds
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible feeds
        run: python -m china_calendar.cli --check
      - name: Commit changed data
        run: |
          if git diff --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calendars
          git commit -m "chore(data): update calendar feeds"
          git push
      - name: Keep the daily schedule enabled
        # GitHub disables scheduled workflows in public repositories after 60
        # days without repository activity. The bot only commits when official
        # data changes, so quiet months could otherwise stop updates silently.
        # Calling the enable endpoint on the active workflow serves as a keepalive;
        # a failure here must not block the Pages deployment that follows.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update-calendar.yml/enable"

name: Update calendar

on:
  schedule:
    # 21:00 Asia/Shanghai (UTC+8), every day.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official data and rebuild feeds
        run: python -m china_calendar.cli
      - name: Test feeds
        run: python -m unittest discover -s tests -v
      - name: Commit changed data
        run: |
          if git diff --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calendars
          git commit -m "chore(data): update calendar feeds"
          git push


name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "china_calendar/**", "data/**", "config/**", "calendars/**", ".github/workflows/pages.yml"]
  # Commits made by GITHUB_TOKEN do not trigger another push workflow.
  workflow_run:
    workflows: ["Update calendar"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify calendar inputs
        run: python -m china_calendar.cli --check
      - name: Build static calendar site
        run: python -m china_calendar.site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
